name: UI Automation CI & Asset Governance

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  validate-and-test:
    name: Asset Validation & Dry-Run Test Collection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate UI Asset Registry
        run: |
          python tools/validate_ui_assets.py --registry test_assets/registry/ui_case_assets.yaml

      - name: Dry-Run Pytest Collection (UAT)
        run: |
          python run_tests.py --env uat --dry-run

      - name: Dry-Run Pytest Collection (PROD Protection Verification)
        run: |
          python run_tests.py --env prod --dry-run
