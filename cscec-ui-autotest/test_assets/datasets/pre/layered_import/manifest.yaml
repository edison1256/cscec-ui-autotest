# 预发环境 (PRE) 分层数据资源导入测试数据清单
# 对应需求大纲: D:\Doc\一体化\用例\数据资源导入功能优化以及性能优化V2.xmind
# 环境: https://irp-pre.cscec.com/

m02_datasets:
  standard_valid:
    filename: "m02_standard_valid.xlsx"
    description: "PRE 标准有效分层清单（一级应用域: 建造一体化, L1: 数字建造管理, L2: 项目立项, L3: 主策划）"
    expected_status: "valid"
    expected_headers: ["一级应用域名称", "L1", "L1定义", "L2", "L2定义", "L3", "L3定义"]
    l1: "数字建造管理"
    l2: "项目立项"
    l3: "主策划"

  variant_progress:
    filename: "m02_variant_progress.xlsx"
    description: "PRE 单行有效分层清单（一级应用域: 企业管理协同），用于进度条展示与多次重传验证"
    expected_status: "valid"

  column_mismatch:
    filename: "m02_error_column_mismatch.xlsx"
    description: "PRE 列名与模板不符（级应用域名称、L11、L4）"
    expected_status: "error"
    expected_error_snippets: ["列名与模板不符", "模板不符", "错误"]
    block_import: true

  missing_domain_and_empty:
    filename: "m02_error_missing_domain_and_empty.xlsx"
    description: "PRE 多行错误（包含不存在的应用域与空值）"
    expected_status: "error"
    expected_error_snippets: ["不存在", "不能为空", "错误", "第 2 行"]
    block_import: true

  missing_l1_l2_l3:
    filename: "m02_error_missing_l1_l2_l3.xlsx"
    description: "PRE L1/L2/L3 层级名称为空异常拦截"
    expected_status: "error"
    expected_error_snippets: ["错误", "不能为空"]
    block_import: true

  duplicate_cross_domain:
    filename: "m02_duplicate_cross_domain.xlsx"
    description: "PRE 不同一级应用域（建造一体化 vs 企业管理协同）下相同层级，判定合规允许通过"
    expected_status: "valid"

  same_def_diff_name:
    filename: "m02_same_def_diff_name.xlsx"
    description: "PRE 定义相同但层级名称不同，判定合规放行"
    expected_status: "valid"

m03_datasets:
  standard_valid:
    filename: "m03_standard_valid.xlsx"
    description: "PRE 标准有效数据实体清单（域: 测试test, 系统: 测试test123, 分层: test001/test002/test003, 已存在实体: test0001）"
    expected_status: "valid"
    expected_headers: ["一级应用域", "应用系统", "L1", "L2", "L3", "表中文名", "表英文名", "表描述", "存储类型", "业务类型", "系统环境类型"]
    table_english_name: "test0001"
    table_chinese_name: "测试表0001"
    app_domain: "测试test"
    app_system: "测试test123"

  reference_and_required_errors:
    filename: "m03_error_reference_and_required.xlsx"
    description: "PRE 引用数据（域/系统/分层不存在）及必填缺失错误"
    expected_status: "error"
    expected_error_snippets: ["不存在", "不匹配", "不能为空", "错误", "校验失败"]
    block_import: true

