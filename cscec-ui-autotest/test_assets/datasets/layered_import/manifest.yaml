# 分层数据资源导入测试数据清单 (Data-Driven Manifest)
# 对应需求大纲: D:\Doc\一体化\用例\数据资源导入功能优化以及性能优化V2.xmind

m02_datasets:
  standard_valid:
    filename: "m02_standard_valid.xlsx"
    original_filename: "M02数据分层清单.xlsx"
    description: "标准有效数据分层清单（包含测试/测试使用/主线程1等多级分层）"
    expected_status: "valid"
    expected_headers: ["一级应用域名称", "L1", "L1定义", "L2", "L2定义", "L3", "L3定义"]
    l1: "测试使用"
    l2: "测试"
    l3: "主线程1"

  variant_progress:
    filename: "m02_variant_progress.xlsx"
    original_filename: "M02数据分层清单 - 副本.xlsx"
    description: "单行有效分层清单，用于进度条展示与多次重传验证"
    expected_status: "valid"

  column_mismatch:
    filename: "m02_error_column_mismatch.xlsx"
    original_filename: "M02数据分层清单 - 副本 - 副本 - 副本.xlsx"
    description: "列名与模板不符（级应用域名称、L11、L4）"
    expected_status: "error"
    expected_error_snippets: ["列名与模板不符", "模板不符", "错误"]
    block_import: true

  missing_domain_and_empty:
    filename: "m02_error_missing_domain_and_empty.xlsx"
    original_filename: "M02数据分层清单 - 副本 - 副本.xlsx"
    description: "多行错误（第2/4/5/6行包含一级应用域不存在或为空）"
    expected_status: "error"
    expected_error_snippets: ["第 2 行", "第 4 行", "不存在", "不能为空", "错误"]
    block_import: true

  missing_l1_l2_l3:
    filename: "m02_error_missing_l1_l2_l3.xlsx"
    original_filename: "M02数据分层清单 - 副本 - 副本 - 副本 - 副本 (2).xlsx"
    description: "L1/L2/L3 层级名称为空异常拦截"
    expected_status: "error"
    expected_error_snippets: ["第 2 行", "错误", "不能为空"]
    block_import: true

  duplicate_cross_domain:
    filename: "m02_duplicate_cross_domain.xlsx"
    original_filename: "M02数据分层清单 - 副本 - 副本 - 副本 - 副本 (2) - 副本.xlsx"
    description: "不同一级应用域下出现相同L1/L2/L3名称，判定合规允许通过"
    expected_status: "valid"

  same_def_diff_name:
    filename: "m02_same_def_diff_name.xlsx"
    original_filename: "M02数据分层清单 - 副本 - 副本 - 副本 - 副本 (2) - 副本 - 副本 - 副本.xlsx"
    description: "定义相同但层级名称不同，系统判定合规放行"
    expected_status: "valid"

m03_datasets:
  standard_valid:
    filename: "m03_standard_valid.xlsx"
    original_filename: "M03数据实体清单.xlsx"
    description: "标准有效数据实体清单（表英文名: test0813table1, 表中文名: test0813表1）"
    expected_status: "valid"
    expected_headers: ["一级应用域名称", "应用系统名称", "L1", "L2", "L3", "表中文名称", "表英文名称", "表描述", "存储周期", "系统项目组"]
    table_english_name: "test0813table1"
    table_chinese_name: "test0813表1"
    app_domain: "测试test"
    app_system: "测试test123"

  reference_and_required_errors:
    filename: "m03_error_reference_and_required.xlsx"
    original_filename: "M03数据实体清单 - 副本 - 副本.xlsx"
    description: "引用数据（域不存在/系统不存在/域系统不匹配/分层不匹配）及必填缺失错误"
    expected_status: "error"
    expected_error_snippets: ["不存在", "不匹配", "不能为空", "错误", "校验失败"]
    block_import: true
