# 生产环境 (PROD) 分层数据资源导入测试数据清单
# 基线已确认的专用链路：
# 一级应用域 / 应用系统 = 中建云测试专用
# L1 / L2 / L3 = 中建云测试专用L1 / 中建云测试专用L2 / 中建云测试专用L3
# 数据资源表英文名 = cloudtest

m02_datasets:
  standard_valid:
    filename: "m02_standard_valid.xlsx"
    description: "PROD 标准有效分层清单（专用链路下的有效新分层）"
    expected_status: "valid"
    expected_headers: ["一级应用域名称", "L1", "L1定义", "L2", "L2定义", "L3", "L3定义"]

  variant_progress:
    filename: "m02_variant_progress.xlsx"
    description: "PROD 单行有效分层清单，用于进度条展示与多次重传验证"
    expected_status: "valid"

  column_mismatch:
    filename: "m02_error_column_mismatch.xlsx"
    description: "PROD 列名与模板不符（级应用域名称、L11、L4）"
    expected_status: "error"
    expected_error_snippets: ["列名与模板不符", "模板不符", "错误"]
    block_import: true

  missing_domain_and_empty:
    filename: "m02_error_missing_domain_and_empty.xlsx"
    description: "PROD 多行错误（第2/4行包含一级应用域不存在或为空）"
    expected_status: "error"
    expected_error_snippets: ["第 2 行", "第 4 行", "不存在", "不能为空", "错误"]
    block_import: true

  missing_l1_l2_l3:
    filename: "m02_error_missing_l1_l2_l3.xlsx"
    description: "PROD L1/L2/L3 层级名称为空异常拦截"
    expected_status: "error"
    expected_error_snippets: ["第 1 行", "第 2 行", "错误", "不能为空"]
    block_import: true

  duplicate_cross_domain:
    filename: "m02_duplicate_cross_domain.xlsx"
    description: "PROD 同域下不同 L1/L2/L3 组合放行"
    expected_status: "valid"

  same_def_diff_name:
    filename: "m02_same_def_diff_name.xlsx"
    description: "PROD 定义相同但层级名称不同，判定合规放行"
    expected_status: "valid"

  explicit_business_paths:
    filename: "m02_explicit_business_paths.xlsx"
    description: "PROD 专用固定层级路径（用于 20260907 同表不同业务层级专项）"
    expected_status: "valid"

m03_datasets:
  standard_valid:
    filename: "m03_standard_valid.xlsx"
    description: "PROD 标准有效数据实体清单（表英文名: cloudtest）"
    expected_status: "valid"
    expected_headers: ["一级应用域名称", "应用系统名称", "L1", "L2", "L3", "表中文名称", "表英文名称", "表描述", "存储周期", "系统项目组"]
    table_english_name: "cloudtest"
    table_chinese_name: "中建云测试专用"
    app_domain: "中建云测试专用"
    app_system: "中建云测试专用"

  reference_and_required_errors:
    filename: "m03_error_reference_and_required.xlsx"
    description: "PROD 引用数据（域不存在/系统不存在/域系统不匹配/分层不匹配）及必填缺失错误"
    expected_status: "error"
    expected_error_snippets: ["不存在", "不匹配", "不能为空", "错误", "校验失败"]
    block_import: true

m04_datasets:
  standard_valid:
    filename: "m04_standard_valid.xlsx"
    description: "PROD 标准有效数据属性清单（实体: cloudtest，字段: prod_m04_attr_valid_001）"
    expected_status: "valid"
    expected_headers:
      [
        "一级应用域编号",
        "一级应用域名称",
        "应用系统编码",
        "应用系统名称",
        "L1",
        "L2",
        "L3",
        "表中文名",
        "表英文名",
        "字段中文名",
        "字段英文名",
        "字段业务规则和含义",
        "缺省值",
        "字段类型",
        "取值范围",
        "数据长度",
        "是否主键",
        "是否可空",
        "是否外键",
        "外键关联信息",
        "是否本系统产生的数据",
        "数据来源系统",
        "数据来源本系统模块",
        "数据安全分类",
        "数据安全分级",
        "是否国资监管",
        "监管指标项编号",
        "监管指标项名称",
      ]
    table_english_name: "cloudtest"
    field_english_name: "prod_m04_attr_valid_001"

  reference_and_required_errors:
    filename: "m04_reference_and_required_errors.xlsx"
    description: "PROD 引用错误与必填缺失混合样例（用于校验错误行提示）"
    expected_status: "error"
    expected_error_snippets: ["不存在", "不能为空", "错误", "校验失败"]
    block_import: true
