    - /engine/metadata/getMenuTreeForPortal\?moduleCode=
  owner_note: 先按菜单接口判断当前账号适用性，接口下发后 UI 缺失必须失败
  ignore_rules: []
  critical_api_rationale: ''

conditional_data_defaults: &conditional_data_defaults
  classification: conditional
  prerequisites:
    - type: stable_business_sample
      expected: 资产登记中存在唯一且允许只读查看的生产样本
  critical_api_patterns: []
  owner_note: 执行前必须验证稳定业务样本
  ignore_rules: []
  critical_api_rationale: ''

probe_defaults: &probe_defaults
  classification: probe
  prerequisites: []
  critical_api_patterns: []
  owner_note: 非阻断探查，不计入 Mandatory 通过率
  ignore_rules: []
  critical_api_rationale: ''

