      expected: 当前测试账号已登记为可见
  critical_api_patterns: []
  owner_note: 入口适用范围取决于账号权限或工作台配置
  ignore_rules: []
  critical_api_rationale: ''

conditional_menu_defaults: &conditional_menu_defaults
