[pytest]
# 测试路径
testpaths = tests

# 文件匹配模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 默认选项
addopts =
    -v
    --tb=short
    --strict-markers
    --strict-config
    -ra
    --html=reports/report.html
    --self-contained-html
    --alluredir=reports/allure-results
    # 并行执行（取消注释启用）
    # -n auto
    # 失败重试（取消注释启用）
    # --reruns 2
    # --reruns-delay 5

# 标记定义
markers =
    smoke: 冒烟测试 - 快速验证核心功能
    readonly: 只读测试 - 不产生业务写入或状态变更
    write: 写入测试 - 会新增、保存、上传、提交或改变业务数据
    destructive: 破坏性测试 - 会删除、撤回、审批流转或产生不可轻易恢复的状态
    regression: 回归测试 - 全面功能验证
    e2e: 端到端测试 - 完整业务流程
    login: 登录模块测试
    portal: 门户模块测试
    console: 控制台模块测试
    ops: 运维巡检模块测试
    doccenter: 文档中心模块测试
    dataresources: 数据资源管理模块测试
    resource: 资源管理模块测试
    order: 订单管理模块测试
    approval: 审批待办模块测试
    ticket: 工单中心模块测试
    mobile: 移动端模块测试
    layered_import: 分层数据资源导入新需求模块测试
    domain_split: 域名拆分需求测试
    slow: 慢速测试 - 执行时间超过30秒
    flaky: 不稳定测试 - 需要额外关注
    skip_ci: 跳过 CI 执行

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s (%(filename)s:%(lineno)d)
log_file_date_format = %Y-%m-%d %H:%M:%S

# 超时配置（需要 pytest-timeout 插件）
timeout = 300
timeout_method = thread

# 最小版本
minversion = 8.0

# 过滤警告
filterwarnings =
    ignore::DeprecationWarning
    ignore:.*Unverified HTTPS request.*:Warning

# 测试发现
norecursedirs = .git .venv node_modules __pycache__ .idea reports logs screenshots templates
